name: Install Lab 4 Promethean Agent

on:
  push:
    branches:
      - assignment-4-promethean-classification-agent
    paths:
      - ".github/workflows/install-lab4.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Recover payload and install specialist files
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/install-lab4.yml > /tmp/previous.yml
          python - <<'PY'
          from pathlib import Path
          t = Path('/tmp/previous.yml').read_text()
          start = t.index("<<'PAYLOAD'") + len("<<'PAYLOAD'")
          start = t.index("\n", start) + 1
          end = t.index("\nPAYLOAD", start)
          Path('/tmp/agent.b64').write_text(t[start:end].strip())
          PY
          base64 -d /tmp/agent.b64 > /tmp/agent.tar.gz
          tar -xzf /tmp/agent.tar.gz -C .
          rm -f .github/workflows/install-lab4.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete Assignment 4 Promethean Classification Agent"
          git push origin HEAD:assignment-4-promethean-classification-agent
